                    - code [ref=f14e784]: folder_deleted
                    - text: . The
                    - code [ref=f14e785]: folder_completed
                    - text: notification is part of the delivery lifecycle but is not a separate channel-subscription switch.
                  - paragraph [ref=f14e786]:
                    - text: Example
                    - code [ref=f14e787]: folder_signed
                    - text: "payload:"
                  - code [ref=f14e789]: "{ \"event_name\": \"folder_signed\", \"event_date\": 1464237988093, \"data\": { \"folder\": { \"folderId\": 649, \"folderName\": \"NDA\", \"folderAuthorEmail\": \"abc@xyz.com\", \"folderStatus\": \"SHARED\", \"folderDocumentIds\": [1239, 1240] }, \"signing_party\": { \"partyId\": 1, \"firstName\": \"John\", \"lastName\": \"Doe\", \"emailId\": \"johndoe@example.com\" } } }"
                  - heading "Webhook Security" [level=2] [ref=f14e790]
                  - paragraph [ref=f14e791]:
                    - text: Always register an HTTPS webhook URL. For additional authenticity and integrity checks, assign a
                    - code [ref=f14e792]: webhookSecret
                    - text: when creating or updating the channel.
                  - paragraph [ref=f14e793]: "When a secret is configured, Foxit eSign:"
                  - list [ref=f14e794]:
                    - listitem [ref=f14e795]: Calculates an HMAC-SHA-256 digest of the raw HTTP request body using the webhook secret.
                    - listitem [ref=f14e796]: Base64-encodes the digest.
                    - listitem [ref=f14e797]:
                      - text: Adds the value to the callback URL as the
                      - code [ref=f14e798]: signature
                      - text: query parameter.
                  - paragraph [ref=f14e799]:
                    - text: For a registered URL of
                    - code [ref=f14e800]: https://example.com/esign-webhook
                    - text: ", the delivery URL has the form:"
                  - code [ref=f14e802]: https://example.com/esign-webhook?signature=BASE64_SIGNATURE
                  - paragraph [ref=f14e803]: Verify the signature against the exact raw request bytes before parsing or modifying the JSON. Use a constant-time comparison and reject the request when the signature is absent or invalid.
                  - code [ref=f14e805]: "import { createHmac, timingSafeEqual } from \"node:crypto\"; export function verifyWebhook(rawBody, receivedSignature, secret) { const expected = createHmac(\"sha256\", secret) .update(rawBody) .digest(); const received = Buffer.from(receivedSignature, \"base64\"); return received.length === expected.length && timingSafeEqual(received, expected); }"
                  - paragraph [ref=f14e806]: Treat the webhook secret like a password. Store it securely and never log or expose it to clients.
