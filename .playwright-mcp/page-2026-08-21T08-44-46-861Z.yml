                - generic [ref=f14e710]:
                  - paragraph [ref=f14e711]: Foxit eSign webhooks notify your application when an envelope changes. Webhook delivery is asynchronous, so your endpoint should acknowledge each request quickly and process longer-running work separately.
                  - heading "Webhook Overview" [level=2] [ref=f14e712]
                  - paragraph [ref=f14e713]:
                    - text: A webhook channel connects a publicly accessible endpoint to one or more eSign events. Channels can receive activity for envelopes created through the API, or for the entire account when the channel level is set to
                    - code [ref=f14e714]: Account
                    - text: .
                  - paragraph [ref=f14e715]:
                    - text: Configure delivery and event subscriptions with the operations in
                    - link "Webhook Channels" [ref=f14e716] [cursor=pointer]:
                      - /url: /reference/tag/webhook-channels
                    - text: .
                  - heading "Webhook Events" [level=2] [ref=f14e717]
                  - paragraph [ref=f14e718]:
                    - text: Every webhook request is an HTTP
                    - code [ref=f14e719]: POST
                    - text: containing an
                    - code [ref=f14e720]: event_name
                    - text: ", an"
                    - code [ref=f14e721]: event_date
                    - text: expressed as Unix time in milliseconds, and a
                    - code [ref=f14e722]: data
