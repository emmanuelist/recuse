                  - generic [ref=f11e971]:
                    - paragraph [ref=f11e972]: A webhook channel connects Foxit eSign to a publicly accessible endpoint. You can create multiple channels and independently select the envelope events delivered to each one.
                    - paragraph [ref=f11e973]: Channel operations let you create a destination, retrieve one channel, list every channel in the account, update its endpoint or subscriptions, temporarily deactivate or reactivate delivery, and permanently delete channels.
                    - paragraph [ref=f11e974]:
                      - text: Configure a
                      - code [ref=f11e975]: webhookSecret
                      - text: to sign deliveries and validate the
