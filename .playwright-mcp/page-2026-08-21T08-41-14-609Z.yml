                  - heading "Webhooks" [level=2] [ref=f11e848]
                  - button "Copy link" [ref=f11e849] [cursor=pointer]
                - generic [ref=f11e857]:
                  - paragraph [ref=f11e858]: Foxit eSign webhooks notify your application when an envelope changes. Webhook delivery is asynchronous, so your endpoint should acknowledge each request quickly and process longer-running work separately.
                  - heading "Webhook Overview" [level=2] [ref=f11e859]
                  - paragraph [ref=f11e860]:
                    - text: A webhook channel connects a publicly accessible endpoint to one or more eSign events. Channels can receive activity for envelopes created through the API, or for the entire account when the channel level is set to
                    - code [ref=f11e861]: Account
                    - text: .
                  - paragraph [ref=f11e862]:
                    - text: Configure delivery and event subscriptions with the operations in
                    - link "Webhook Channels" [ref=f11e863] [cursor=pointer]:
                      - /url: /reference/tag/webhook-channels
                    - text: .
                  - heading "Webhook Events" [level=2] [ref=f11e864]
                  - paragraph [ref=f11e865]:
                    - text: Every webhook request is an HTTP
                    - code [ref=f11e866]: POST
                    - text: containing an
                    - code [ref=f11e867]: event_name
                    - text: ", an"
                    - code [ref=f11e868]: event_date
                    - text: expressed as Unix time in milliseconds, and a
                    - code [ref=f11e869]: data
                    - text: object containing the affected envelope.
                  - table [ref=f11e870]:
                    - rowgroup [ref=f11e871]:
                      - row [ref=f11e872]:
                        - columnheader "Event" [ref=f11e873]
                        - columnheader "When it is delivered" [ref=f11e874]
                        - columnheader "Additional data" [ref=f11e875]
                    - rowgroup [ref=f11e876]:
                      - row [ref=f11e877]:
                        - cell [ref=f11e878]:
                          - code [ref=f11e879]: folder_sent
                        - cell "An envelope is sent for signature." [ref=f11e880]
                        - cell [ref=f11e881]:
                          - code [ref=f11e882]: folder
                      - row [ref=f11e883]:
                        - cell [ref=f11e884]:
                          - code [ref=f11e885]: folder_viewed
                        - cell "A recipient opens the envelope for the first time." [ref=f11e886]
                        - cell [ref=f11e887]:
                          - code [ref=f11e888]: folder
                          - text: ","
                          - code [ref=f11e889]: viewing_party
                      - row [ref=f11e890]:
                        - cell [ref=f11e891]:
                          - code [ref=f11e892]: folder_signed
                        - cell "A recipient signs the envelope." [ref=f11e893]
                        - cell [ref=f11e894]:
                          - code [ref=f11e895]: folder
                          - text: ","
                          - code [ref=f11e896]: signing_party
                      - row [ref=f11e897]:
                        - cell [ref=f11e898]:
                          - code [ref=f11e899]: folder_cancelled
                        - cell "A recipient cancels or declines the envelope." [ref=f11e900]
                        - cell [ref=f11e901]:
                          - code [ref=f11e902]: folder
                          - text: ","
                          - code [ref=f11e903]: cancelling_party
                          - text: ","
                          - code [ref=f11e904]: reason_for_cancelling
                      - row [ref=f11e905]:
                        - cell [ref=f11e906]:
                          - code [ref=f11e907]: folder_completed
                        - cell "All required recipients have completed signing." [ref=f11e908]
                        - cell [ref=f11e909]:
                          - code [ref=f11e910]: folder
                      - row [ref=f11e911]:
                        - cell [ref=f11e912]:
                          - code [ref=f11e913]: folder_executed
                        - cell [ref=f11e914]:
                          - text: Digital signatures have been applied to the completed documents. This normally follows
                          - code [ref=f11e915]: folder_completed
                          - text: by approximately 5–10 seconds.
                        - cell [ref=f11e916]:
                          - code [ref=f11e917]: folder
                      - row [ref=f11e918]:
                        - cell [ref=f11e919]:
                          - code [ref=f11e920]: folder_deleted
                        - cell "An envelope is deleted." [ref=f11e921]
                        - cell [ref=f11e922]:
                          - code [ref=f11e923]: folder
                          - text: ","
                          - code [ref=f11e924]: deleting_party
                  - paragraph [ref=f11e925]:
                    - text: Channel subscriptions expose
                    - code [ref=f11e926]: folder_sent
                    - text: ","
                    - code [ref=f11e927]: folder_viewed
                    - text: ","
                    - code [ref=f11e928]: folder_signed
                    - text: ","
                    - code [ref=f11e929]: folder_cancelled
                    - text: ","
                    - code [ref=f11e930]: folder_executed
                    - text: ", and"
                    - code [ref=f11e931]: folder_deleted
                    - text: . The
                    - code [ref=f11e932]: folder_completed
                    - text: notification is part of the delivery lifecycle but is not a separate channel-subscription switch.
                  - paragraph [ref=f11e933]:
                    - text: Example
                    - code [ref=f11e934]: folder_signed
                    - text: "payload:"
                  - code [ref=f11e936]: "{ \"event_name\": \"folder_signed\", \"event_date\": 1464237988093, \"data\": { \"folder\": { \"folderId\": 649, \"folderName\": \"NDA\", \"folderAuthorEmail\": \"abc@xyz.com\", \"folderStatus\": \"SHARED\", \"folderDocumentIds\": [1239, 1240] }, \"signing_party\": { \"partyId\": 1, \"firstName\": \"John\", \"lastName\": \"Doe\", \"emailId\": \"johndoe@example.com\" } } }"
                  - heading "Webhook Security" [level=2] [ref=f11e937]
                  - paragraph [ref=f11e938]:
                    - text: Always register an HTTPS webhook URL. For additional authenticity and integrity checks, assign a
                    - code [ref=f11e939]: webhookSecret
                    - text: when creating or updating the channel.
                  - paragraph [ref=f11e940]: "When a secret is configured, Foxit eSign:"
                  - list [ref=f11e941]:
                    - listitem [ref=f11e942]: Calculates an HMAC-SHA-256 digest of the raw HTTP request body using the webhook secret.
                    - listitem [ref=f11e943]: Base64-encodes the digest.
                    - listitem [ref=f11e944]:
                      - text: Adds the value to the callback URL as the
                      - code [ref=f11e945]: signature
                      - text: query parameter.
                  - paragraph [ref=f11e946]:
                    - text: For a registered URL of
                    - code [ref=f11e947]: https://example.com/esign-webhook
                    - text: ", the delivery URL has the form:"
                  - code [ref=f11e949]: https://example.com/esign-webhook?signature=BASE64_SIGNATURE
                  - paragraph [ref=f11e950]: Verify the signature against the exact raw request bytes before parsing or modifying the JSON. Use a constant-time comparison and reject the request when the signature is absent or invalid.
                  - code [ref=f11e952]: "import { createHmac, timingSafeEqual } from \"node:crypto\"; export function verifyWebhook(rawBody, receivedSignature, secret) { const expected = createHmac(\"sha256\", secret) .update(rawBody) .digest(); const received = Buffer.from(receivedSignature, \"base64\"); return received.length === expected.length && timingSafeEqual(received, expected); }"
                  - paragraph [ref=f11e953]: Treat the webhook secret like a password. Store it securely and never log or expose it to clients.
              - region [ref=f11e956]:
                - generic [ref=f11e959]:
                  - heading "Webhook Channels (Collapsed)" [level=2] [ref=f11e961]:
